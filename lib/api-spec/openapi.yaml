        progressRecordCount: { type: integer }
        financialRecordCount: { type: integer }
        imageWithDateCount: { type: integer }
        firstEventDate: { type: ["string", "null"] }
        lastEventDate: { type: ["string", "null"] }
        firstProgressDate: { type: ["string", "null"] }
        lastProgressDate: { type: ["string", "null"] }
        progressReportCount: { type: integer }
        elapsedDays: { type: ["integer", "null"] }
        progressChange: { type: ["number", "null"] }
        progressRatePerDay: { type: ["number", "null"] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/TemporalCheck" }
        reasons:
          type: array
          items: { type: string }
        engineVersion: { type: string }
        updatedAt: { type: string }
    Investigation:
      type: object
      required: [status, notes, decision, history]
      properties:
        status: { type: string, enum: [Pending Review, Under Investigation, Verified, Needs Field Visit, Resolved] }
        notes: { type: string }
        decision: { type: string }
        history:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
    HistoryItem:
      type: object
      required: [id, status, note, officer, time]
      properties:
        id: { type: string }
        status: { type: string }
        note: { type: string }
        officer: { type: string }
        time: { type: string }
    InvestigationInput:
      type: object
      required: [status, notes, decision]
      properties:
        status: { type: string }
        notes: { type: string }
        decision: { type: string }
    ProgressRecord:
      type: object
      required: [id, projectId, reportDate, progressPercent, note, source, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: string }
        reportDate: { type: string }
        progressPercent: { type: integer }
        note: { type: ["string", "null"] }
        source: { type: string }
        createdAt: { type: string }
    ProgressRecordInput:
      type: object
      required: [reportDate, progressPercent]
      properties:
        reportDate: { type: string, description: "ISO date (YYYY-MM-DD) the progress was actually observed/reported — not today's date." }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        note: { type: string }
    UploadInput:
      type: object
      required: [filename, records]
      properties:
        filename: { type: string }
        records:
          type: array
          description: Raw register rows; the API validates each row against ProjectInput.
          items: { $ref: "#/components/schemas/UploadRecord" }
        rowNumbers:
          type: array
          description: Spreadsheet row number for each record, including the header row.
          items: { type: integer }
    UploadRecord:
      type: object
      additionalProperties: true
    UploadResult:
      type: object
      required: [imported, rejected, missingFields, qualityScore, rowErrors]
      properties:
        imported: { type: integer }
        rejected: { type: integer }
        missingFields:
          type: array
          items: { type: string }
        qualityScore: { type: number }
        rowErrors:
          type: array
          items:
            $ref: "#/components/schemas/UploadRowError"
    UploadRowError:
      type: object
      required: [row, errors]
      properties:
        row: { type: integer }
        errors:
          type: array
          items: { type: string }