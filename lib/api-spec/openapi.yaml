        hasValidGps: { type: boolean }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        accuracyMeters: { type: ["number", "null"] }
        distanceMeters: { type: ["number", "null"], description: "Haversine distance from the declared project location, in meters." }
        invalidReason: { type: ["string", "null"], enum: [missing, out_of_range, null] }
    GeoAnalysis:
      type: object
      required: [status, score, confidence, declaredLatitude, declaredLongitude, imageCount, validGpsCount, invalidGpsCount, missingGpsCount, minDistanceMeters, maxDistanceMeters, medianDistanceMeters, points, checks, reasons, engineVersion, updatedAt]
      properties:
        status: { type: string, enum: [INSUFFICIENT_EVIDENCE, LOCATION_CONSISTENT, LOCATION_ANOMALY] }
        score:
          type: ["number", "null"]
          description: Normalized 0-1 anomaly score. Null when status is INSUFFICIENT_EVIDENCE.
        confidence:
          type: number
          description: 0-1 evidence-quality/confidence, independent of the anomaly score itself.
        declaredLatitude: { type: ["number", "null"] }
        declaredLongitude: { type: ["number", "null"] }
        imageCount: { type: integer }
        validGpsCount: { type: integer }
        invalidGpsCount: { type: integer }
        missingGpsCount: { type: integer }
        minDistanceMeters: { type: ["number", "null"] }
        maxDistanceMeters: { type: ["number", "null"] }
        medianDistanceMeters: { type: ["number", "null"] }
        points:
          type: array
          items: { $ref: "#/components/schemas/GeoEvidencePoint" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/GeoCheck" }
        reasons:
          type: array
          items: { type: string }
        engineVersion: { type: string }
        updatedAt: { type: string }
    TemporalCheck:
      type: object
      required: [name, severity, message]
      properties:
        name: { type: string }
        severity: { type: string, enum: [INFO, LOW, MODERATE, HIGH] }
        message: { type: string }
        observed:
          type: object
          additionalProperties: { type: number }
        supportingRecordIds:
          type: array
          items: { type: integer }
    TemporalAnalysis:
      type: object
      required: [status, score, confidence, progressRecordCount, financialRecordCount, imageWithDateCount, firstEventDate, lastEventDate, firstProgressDate, lastProgressDate, progressReportCount, elapsedDays, progressChange, progressRatePerDay, checks, reasons, engineVersion, updatedAt]
      properties:
        status: { type: string, enum: [INSUFFICIENT_EVIDENCE, TEMPORALLY_CONSISTENT, TEMPORAL_ANOMALY] }
        score:
          type: ["number", "null"]
          description: Normalized 0-1 anomaly score. Null when status is INSUFFICIENT_EVIDENCE.
        confidence:
          type: number
