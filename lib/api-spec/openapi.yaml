openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: WorkTruth evidence-integrity and verification-prioritization API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: projects
  - name: analysis
  - name: investigations
  - name: uploads
  - name: evidence
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check — also verifies PostgreSQL connectivity (a lightweight SELECT 1); never fails due to an optional external provider, since none currently exist
      responses:
        "200":
          description: Healthy (API and database both reachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded — the API process is up but PostgreSQL could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with an officer account. Sets an httpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated officer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid input
        "401":
          description: Invalid credentials
  /auth/guest:
    post:
      operationId: guestLogin
      tags: [auth]
      summary: Start a read-only "Explore demo" session. Sets an httpOnly session cookie.
      description: >-
        Issues a session for the shared GUEST account without credentials. That account holds the
        read-only GUEST role, so every mutating endpoint rejects it with 403 regardless of what the
        client sends. Returns 404 when guest access is disabled or the account has been deactivated.
      responses:
        "200":
          description: Read-only guest session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "404":
          description: Guest access is not available
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session and clear the session cookie
      responses:
        "204":
          description: Session ended
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the currently authenticated officer
      responses:
        "200":
          description: Authenticated officer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Not authenticated
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Dashboard overview metrics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recent evidence and investigation activity
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List and filter projects
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: priority
          schema:
            type: string
            enum: [LOW, MODERATE, HIGH, CRITICAL]
        - in: query
          name: district
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [priority, financial, visual, evidence, date] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Project queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project investigation record
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404": { description: Project not found }
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project record
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}/analysis:
    get:
      operationId: getProjectAnalysis
      tags: [analysis]
      summary: Get all multimodal analysis results
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisBundle"
    post:
      operationId: analyzeProject
      tags: [analysis]
      summary: Run the deterministic local evidence analysis pipeline
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: Analysis accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisBundle"
  /projects/{id}/risk:
    get:
      operationId: getProjectRisk
      tags: [analysis]
      summary: Get explainable evidence fusion and verification priority
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Risk score and reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
  /projects/{id}/financial-analysis:
    get:
      operationId: getFinancialAnalysis
      tags: [analysis]
      summary: Get financial anomaly analysis
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Financial analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialAnalysis"
  /projects/{id}/visual-analysis:
    get:
      operationId: getVisualAnalysis
      tags: [analysis]
      summary: Get visual evidence analysis
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Visual analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualAnalysis"
  /projects/{id}/text-analysis:
    get:
      operationId: getTextAnalysis
      tags: [analysis]
      summary: Get NLP description similarity analysis
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Text analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TextAnalysis"
  /projects/{id}/geo-analysis:
    get:
      operationId: getGeoAnalysis
      tags: [analysis]
      summary: Get geospatial consistency analysis
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Geographic analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoAnalysis"
  /projects/{id}/temporal-analysis:
    get:
      operationId: getTemporalAnalysis
      tags: [analysis]
      summary: Get temporal consistency analysis
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Temporal analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporalAnalysis"
  /projects/{id}/fusion-analysis:
    get:
      operationId: getFusionAnalysis
      tags: [analysis]
      summary: Get the combined evidence-fusion result across all five lenses (confidence-aware, not a fraud probability)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Evidence fusion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceFusion"
  /projects/{id}/inconsistencies:
    get:
      operationId: getInconsistencies
      tags: [analysis]
      summary: Get structured cross-modal inconsistencies — evidence dimensions that independently tell a materially inconsistent story
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Cross-modal inconsistency analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossModalAnalysis"
  /projects/{id}/investigation:
    get:
      operationId: getInvestigation
      tags: [investigations]
      summary: Get investigation workflow state
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Investigation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
    post:
      operationId: updateInvestigation
      tags: [investigations]
      summary: Update investigation status, notes, or decision
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationInput"
      responses:
        "200":
          description: Updated investigation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investigation"
  /projects/{id}/progress:
    get:
      operationId: listProgressRecords
      tags: [projects]
      summary: List a project's dated progress reports (real evidence consumed by the temporal, cross-modal, fusion, and verification-priority engines)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Progress records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProgressRecord" }
    post:
      operationId: createProgressRecord
      tags: [projects]
      summary: Record a new dated progress report for a project (P0-N — the minimal authenticated write path for progress evidence; re-run analysis afterward to pick it up)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressRecordInput"
      responses:
        "201":
          description: Created progress record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressRecord"
  /upload/projects:
    post:
      operationId: uploadProjects
      tags: [uploads]
      summary: Validate and import a CSV or spreadsheet batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
  /projects/{id}/images:
    get:
      operationId: listProjectImages
      tags: [evidence]
      summary: List evidence images for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Evidence images
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvidenceImage" }
        "404": { description: Project not found }
    post:
      operationId: uploadProjectImage
      tags: [evidence]
      summary: Upload an evidence image for a project. Metadata (dimensions, SHA-256, perceptual hash, EXIF capture date/GPS) is extracted server-side from the actual file — never fabricated.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        description: "multipart/form-data with an 'image' file field and an optional 'label' text field. Deliberately left schema-less here: multipart uploads aren't validated through the generated Zod client (Zod can't meaningfully validate a raw file stream) — multer plus server-side checks (MIME allowlist, size limit, actual decode) validate the real upload in the route handler."
        content:
          multipart/form-data: {}
      responses:
        "201":
          description: Uploaded evidence image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceImage" }
        "400": { description: "Invalid file (wrong type, too large, or not decodable as an image)" }
        "404": { description: Project not found }
  /projects/{id}/images/{imageId}:
    get:
      operationId: getProjectImage
      tags: [evidence]
      summary: Get evidence image metadata
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Evidence image metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceImage" }
        "404": { description: Not found }
    delete:
      operationId: deleteProjectImage
      tags: [evidence]
      summary: Delete an evidence image (removes both the database record and the stored file)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ImageId"
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /projects/{id}/images/{imageId}/file:
    get:
      operationId: getProjectImageFile
      tags: [evidence]
      summary: Get the raw evidence image file bytes
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "404": { description: Not found }
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List every WorkTruth user account. ADMIN role required.
      responses:
        "200":
          description: All user accounts (never includes a password or password hash)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedUser" }
        "401": { description: Not authenticated }
        "403": { description: "Authenticated, but not an ADMIN" }
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a new officer/verifier/viewer/admin account. ADMIN role required. The new user does not get signed in — they authenticate normally afterward at /auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created (never includes the password or its hash)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400": { description: "Invalid input (missing field, bad email, or a password that fails the policy)" }
        "401": { description: Not authenticated }
        "403": { description: "Authenticated, but not an ADMIN" }
        "409": { description: A user with this email already exists }
  /admin/users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [admin]
      summary: Enable or disable a user account. ADMIN role required. Rejected if this would leave zero active ADMIN accounts.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400": { description: "Would remove the last active administrator" }
        "401": { description: Not authenticated }
        "403": { description: "Authenticated, but not an ADMIN" }
        "404": { description: User not found }
  /admin/users/{id}/role:
    patch:
      operationId: updateUserRole
      tags: [admin]
      summary: Change a user's role. ADMIN role required. Rejected if this would demote the last active ADMIN.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400": { description: "Would leave zero active administrators" }
        "401": { description: Not authenticated }
        "403": { description: "Authenticated, but not an ADMIN" }
        "404": { description: User not found }
components:
  parameters:
    ProjectId:
      in: path
      name: id
      required: true
      schema: { type: string }
    ImageId:
      in: path
      name: imageId
      required: true
      schema: { type: integer }
    UserId:
      in: path
      name: id
      required: true
      schema: { type: integer }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database:
          type: string
          enum: [ok, unavailable]
          description: "Whether the API could reach PostgreSQL just now (a lightweight SELECT 1). Absent optional external providers never affect this — WorkTruth's analysis pipeline has none today (see .env.example)."
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
    AuthSession:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
    Role:
      type: string
      description: >-
        ADMIN manages users and has full access. OFFICER/VERIFIER investigate and record verification
        decisions (OFFICER additionally sees the full dashboard/queue; VERIFIER's access is otherwise
        the same). VIEWER is read-only and cannot record a decision or manage users. GUEST is the
        shared read-only account behind "Explore demo"; it is reported here so an administrator can
        see and disable it, but it can never be ASSIGNED to a user account.
      enum: [ADMIN, OFFICER, VERIFIER, VIEWER, GUEST]
    ManagedUser:
      type: object
      description: A user account as shown in Admin User Management. Never includes a password or password hash.
      required: [id, name, email, role, isActive, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        isActive: { type: boolean, description: "false = disabled; a disabled account cannot log in, and any of its existing sessions stop working immediately." }
        createdAt: { type: string }
    CreateUserInput:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: "Temporary password for the new account, subject to the same policy as any other WorkTruth password (minimum 8 characters). Hashed with the existing scrypt implementation before storage; never stored or returned as plaintext."
        role:
          $ref: "#/components/schemas/Role"
    UpdateUserStatusInput:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    UpdateUserRoleInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
    Project:
      type: object
      required: [id, name, category, district, state, sanctionAmount, expenditure, progress, evidenceQuality, priority, primaryFinding, latitude, longitude, startDate, expectedCompletion]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        district: { type: string }
        state: { type: string }
        location: { type: string }
        sanctionAmount: { type: number }
        expenditure: { type: number }
        progress: { type: number }
        evidenceQuality: { type: number }
        priority:
          type: string
          enum: [LOW, MODERATE, HIGH, CRITICAL]
          description: "The project's current computed Verification Priority (from its persisted analysis), kept in sync with AnalysisBundle.risk.priority — not the raw source/import priority value the project record may have been created with."
        primaryFinding:
          type: string
          description: "The single most salient evidence-backed finding (kept in sync with AnalysisBundle.risk.primaryFinding) — never a fabricated narrative. States plainly when no material inconsistency exists or when evidence is insufficient, rather than inventing a finding."
        latitude: { type: number }
        longitude: { type: number }
        startDate: { type: string }
        expectedCompletion: { type: string }
        actualCompletion: { type: ["string", "null"] }
    ProjectInput:
      type: object
      required: [id, name, category, district, state, sanctionAmount, expenditure, progress, latitude, longitude, description]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        district: { type: string }
        state: { type: string }
        location: { type: string }
        sanctionAmount: { type: number }
        expenditure: { type: number }
        progress: { type: number }
        latitude: { type: number }
        longitude: { type: number }
        description: { type: string }
        startDate: { type: string }
        expectedCompletion: { type: string }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        progress: { type: number }
        status: { type: string }
        evidenceQuality: { type: number }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [description, contractor, analysis, investigation]
          properties:
            description: { type: string }
            contractor: { type: string }
            analysis:
              $ref: "#/components/schemas/AnalysisBundle"
            investigation:
              $ref: "#/components/schemas/Investigation"
    ProjectList:
      type: object
      required: [items, total, page, pageSize, districts, categories]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        districts:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
    DashboardStats:
      type: object
      required: [totalProjects, lowRisk, moderateRisk, highRisk, criticalRisk, verificationRequired, averageEvidenceQuality, riskDistribution, categoryBreakdown, anomalySignals, trend, flaggedProjects]
      properties:
        totalProjects: { type: integer }
        lowRisk: { type: integer }
        moderateRisk: { type: integer }
        highRisk: { type: integer }
        criticalRisk: { type: integer }
        verificationRequired: { type: integer }
        averageEvidenceQuality: { type: number }
        riskDistribution:
          type: array
          items: { $ref: "#/components/schemas/DistributionPoint" }
        categoryBreakdown:
          type: array
          items: { $ref: "#/components/schemas/DistributionPoint" }
        anomalySignals:
          type: array
          items: { $ref: "#/components/schemas/DistributionPoint" }
        trend:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
        flaggedProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    DistributionPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    TrendPoint:
      type: object
      required: [month, low, moderate, high, critical]
      properties:
        month: { type: string }
        low: { type: number }
        moderate: { type: number }
        high: { type: number }
        critical: { type: number }
    ActivityItem:
      type: object
      required: [id, type, title, detail, time]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        projectId: { type: ["string", "null"] }
    AnalysisBundle:
      type: object
      required: [status, risk, financial, visual, text, geo, temporal, fusion, inconsistencies, updatedAt]
      properties:
        status: { type: string, enum: [Queued, Processing, Completed, Failed] }
        updatedAt: { type: string }
        risk: { $ref: "#/components/schemas/RiskAssessment" }
        financial: { $ref: "#/components/schemas/FinancialAnalysis" }
        visual: { $ref: "#/components/schemas/VisualAnalysis" }
        text: { $ref: "#/components/schemas/TextAnalysis" }
        geo: { $ref: "#/components/schemas/GeoAnalysis" }
        temporal: { $ref: "#/components/schemas/TemporalAnalysis" }
        fusion: { $ref: "#/components/schemas/EvidenceFusion" }
        inconsistencies: { $ref: "#/components/schemas/CrossModalAnalysis" }
    RiskAssessment:
      type: object
      required: [score, priority, confidence, primaryFinding, reasons, why, recommendation, weights, components, drivers, methodology, engineVersion]
      properties:
        score: { type: number }
        priority:
          type: string
          enum: [LOW, MODERATE, HIGH, CRITICAL]
          description: "The computed Verification Priority — how urgently a human officer should verify this project given the available evidence. This is NOT a probability of fraud and is never presented as one. Computed entirely from fusion.overallEvidenceScore/overallConfidence and cross-modal inconsistency severity counts; never derived from project.priority."
        confidence:
          type: number
          description: "A passthrough of the evidence fusion's overallConfidence — kept separate from `priority` on purpose. A project can be HIGH priority with only moderate confidence, or LOW priority with high confidence."
        primaryFinding:
          type: string
          description: "The single most salient evidence-backed finding, or an honest statement that none exists / evidence is insufficient. Replaces the old fabricated primaryFlag seed narrative entirely — never fabricated."
        reasons:
          type: array
          items: { type: string }
          description: "Exactly why.map(entry => entry.explanation) — every reason here is traceable to a structured entry in `why`."
        why:
          type: array
          items: { $ref: "#/components/schemas/WhyTrailEntry" }
          description: "The structured explainability trail behind `priority` — each entry ties to a specific cross-modal inconsistency, a specific anomalous lens's triggered check, or the fusion engine's own evidence-coverage accounting."
        recommendation: { type: string }
        weights:
          type: object
          additionalProperties: { type: number }
        components:
          type: array
          items:
            $ref: "#/components/schemas/SignalScore"
        drivers:
          $ref: "#/components/schemas/VerificationPriorityDrivers"
        methodology: { type: string }
        engineVersion: { type: string }
    WhyTrailEntry:
      type: object
      required: [type, title, explanation]
      description: "One link in the check -> evidence -> decision chain behind a Verification Priority. CROSS_MODAL entries trace to a specific P0-K inconsistency; FUSION entries trace to a specific anomalous lens's own triggered check; EVIDENCE_COVERAGE and INSUFFICIENT_EVIDENCE entries trace to the fusion engine's own coverage accounting."
      properties:
        type: { type: string, enum: [CROSS_MODAL, FUSION, EVIDENCE_COVERAGE, INSUFFICIENT_EVIDENCE] }
        title: { type: string }
        explanation: { type: string }
        severity:
          $ref: "#/components/schemas/InconsistencySeverity"
        confidence: { type: number }
        evidenceReferences:
          type: array
          items: { $ref: "#/components/schemas/EvidenceReference" }
        supportingChecks:
          type: array
          items: { $ref: "#/components/schemas/SupportingCheck" }
    VerificationPriorityDrivers:
      type: object
      required: [evidenceScore, evidenceConfidence, criticalInconsistencies, highInconsistencies, moderateInconsistencies, lowInconsistencies, availableDimensions]
      properties:
        evidenceScore: { type: ["number", "null"] }
        evidenceConfidence: { type: ["number", "null"] }
        criticalInconsistencies: { type: integer }
        highInconsistencies: { type: integer }
        moderateInconsistencies: { type: integer }
        lowInconsistencies: { type: integer }
        availableDimensions: { type: integer }
    SignalScore:
      type: object
      required: [label, score, weight, contribution]
      properties:
        label: { type: string }
        score: { type: number }
        weight: { type: number }
        contribution: { type: number }
        evidenceSufficient:
          type: boolean
          description: False when this lens could not produce a real score from available evidence (score is a placeholder, typically 0).
    FusionCheck:
      type: object
      required: [name, severity, message]
      properties:
        name: { type: string }
        severity: { type: string, enum: [INFO, LOW, MODERATE, HIGH] }
        message: { type: string }
    NormalizedLens:
      type: object
      required: [lens, status, isInsufficientEvidence, isAnomalous, score, confidence, checks, reasons, engineVersion]
      properties:
        lens: { type: string, enum: [financial, geospatial, temporal, text, visual] }
        status: { type: string }
        isInsufficientEvidence: { type: boolean }
        isAnomalous: { type: boolean }
        score: { type: ["number", "null"] }
        confidence: { type: number }
        checks:
          type: array
          items: { $ref: "#/components/schemas/FusionCheck" }
        reasons:
          type: array
          items: { type: string }
        engineVersion: { type: string }
    EvidenceCoverage:
      type: object
      required: [availableLensCount, totalLensCount, coveragePercent, effectiveWeightCoverage, confidenceAdjustedCoverage, availableLenses, unavailableLenses]
      properties:
        availableLensCount: { type: integer }
        totalLensCount: { type: integer }
        coveragePercent: { type: number }
        effectiveWeightCoverage: { type: number }
        confidenceAdjustedCoverage: { type: number }
        availableLenses:
          type: array
          items: { type: string }
        unavailableLenses:
          type: array
          items: { type: string }
    AgreementSignal:
      type: object
      required: [lenses, description]
      properties:
        lenses:
          type: array
          items: { type: string }
        description: { type: string }
    FusionAgreement:
      type: object
      required: [agreeingLensCount, signals, bonus, explanation]
      properties:
        agreeingLensCount: { type: integer }
        signals:
          type: array
          items: { $ref: "#/components/schemas/AgreementSignal" }
        bonus: { type: number }
        explanation:
          type: array
          items: { type: string }
    FusionMixedEvidence:
      type: object
      required: [isMixed, anomalousLenses, consistentLenses, explanation]
      properties:
        isMixed: { type: boolean }
        anomalousLenses:
          type: array
          items: { type: string }
        consistentLenses:
          type: array
          items: { type: string }
        explanation:
          type: array
          items: { type: string }
    EvidenceFusion:
      type: object
      required: [status, overallEvidenceScore, overallConfidence, coverage, weights, lenses, agreement, mixedEvidence, crossModalSummary, reasons, engineVersion, updatedAt]
      properties:
        status: { type: string, enum: [INSUFFICIENT_EVIDENCE, LIMITED_EVIDENCE, SUFFICIENT_EVIDENCE, STRONG_EVIDENCE] }
        overallEvidenceScore:
          type: ["number", "null"]
          description: "A confidence-weighted evidence-based verification signal, bounded 0-1. This is NOT a probability of fraud and is never presented as one — it is an input to Verification Priority, and a human officer remains the final decision maker."
        overallConfidence: { type: number }
        coverage:
          $ref: "#/components/schemas/EvidenceCoverage"
        weights:
          type: object
          additionalProperties: { type: number }
        lenses:
          type: array
          items: { $ref: "#/components/schemas/NormalizedLens" }
        agreement:
          $ref: "#/components/schemas/FusionAgreement"
        mixedEvidence:
          $ref: "#/components/schemas/FusionMixedEvidence"
        crossModalSummary:
          $ref: "#/components/schemas/FusionCrossModalSummary"
          description: "Purely informational passthrough of the cross-modal inconsistency engine's output — never folded into overallEvidenceScore or overallConfidence, to avoid double-counting findings a lens score may already reflect."
        reasons:
          type: array
          items: { type: string }
        engineVersion: { type: string }
        updatedAt: { type: string }
    InconsistencySeverity:
      type: string
      enum: [INFO, LOW, MODERATE, HIGH, CRITICAL]
    SeverityCounts:
      type: object
      required: [INFO, LOW, MODERATE, HIGH, CRITICAL]
      properties:
        INFO: { type: integer }
        LOW: { type: integer }
        MODERATE: { type: integer }
        HIGH: { type: integer }
        CRITICAL: { type: integer }
    EvidenceReference:
      type: object
      required: [type, label, value]
      properties:
        type: { type: string, enum: [financial_record, progress_record, evidence_image, project_field, check] }
        id: { type: ["string", "integer", "null"] }
        label: { type: string }
        value: { type: ["string", "number", "null"] }
    SupportingCheck:
      type: object
      required: [lens, checkName]
      properties:
        lens: { type: string }
        checkName: { type: string }
    CrossModalInconsistency:
      type: object
      required: [id, type, dimensions, severity, confidence, description, evidenceReferences, supportingChecks, observedValues, expectedRelationship, engineVersion, createdAt]
      description: "A structured, evidence-referenced record of two or more independent evidence dimensions telling a materially inconsistent story. Severity and confidence are tracked separately: severity reflects the strength/materiality of the contradiction, confidence reflects how much corroborating evidence backs it."
      properties:
        id: { type: string, description: "Deterministic — derived from the inconsistency type and the specific evidence IDs involved, never random." }
        type: { type: string }
        dimensions:
          type: array
          items: { type: string, enum: [financial, geospatial, temporal, text, visual, category] }
        severity:
          $ref: "#/components/schemas/InconsistencySeverity"
        confidence: { type: number }
        description: { type: string }
        evidenceReferences:
          type: array
          items: { $ref: "#/components/schemas/EvidenceReference" }
        supportingChecks:
          type: array
          items: { $ref: "#/components/schemas/SupportingCheck" }
        observedValues:
          type: object
          additionalProperties: { type: ["string", "number", "null"] }
        expectedRelationship: { type: string }
        engineVersion: { type: string }
        createdAt: { type: string }
    FusionCrossModalSummary:
      type: object
      required: [count, countsBySeverity, topInconsistencies]
      properties:
        count: { type: integer }
        countsBySeverity:
          $ref: "#/components/schemas/SeverityCounts"
        topInconsistencies:
          type: array
          items: { $ref: "#/components/schemas/CrossModalInconsistency" }
    CrossModalAnalysis:
      type: object
      required: [items, countsBySeverity, engineVersion, updatedAt]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CrossModalInconsistency" }
        countsBySeverity:
          $ref: "#/components/schemas/SeverityCounts"
        engineVersion: { type: string }
        updatedAt: { type: string }
    FinancialCheck:
      type: object
      required: [name, severity, message]
      properties:
        name: { type: string }
        severity: { type: string, enum: [INFO, LOW, MODERATE, HIGH] }
        message: { type: string }
        observed:
          type: object
          additionalProperties: { type: number }
        expected: { type: string }
        supportingRecordIds:
          type: array
          items: { type: integer }
    FinancialPeerGroup:
      type: object
      required: [dimension, size]
      properties:
        dimension: { type: string, description: "Which project fields defined the peer group, e.g. 'category + district'." }
        size: { type: integer }
        median: { type: ["number", "null"] }
        mean: { type: ["number", "null"] }
        standardDeviation: { type: ["number", "null"] }
        mad: { type: ["number", "null"], description: "Median Absolute Deviation, scaled to estimate a normal-distribution standard deviation." }
        percentileRank: { type: ["number", "null"], description: "This project's percentile (0-100) among peers, by expenditure-to-sanction ratio." }
        medianSanction:
          type: ["number", "null"]
          description: >-
            Median SANCTIONED AMOUNT across the peer group, in rupees. Distinct from `median`,
            which is the median expenditure-to-sanction ratio. Null when the peer group is
            smaller than the minimum needed for a meaningful median.
        costRatio:
          type: ["number", "null"]
          description: >-
            This project's sanctioned amount divided by `medianSanction` — e.g. 2.3 means the
            project was sanctioned 2.3x what comparable work was sanctioned for. Null when
            `medianSanction` is null.
    FinancialAnalysis:
      type: object
      required: [evidenceLevel, status, score, confidence, sanction, expenditure, paymentTotal, expenditureRatio, peerGroup, checks, reasons, recordCount, engineVersion, updatedAt]
      properties:
        evidenceLevel:
          type: string
          enum: [NONE, BASIC, DETAILED]
          description: NONE - no usable financial data. BASIC - only summary sanction/expenditure. DETAILED - itemized financial_records ledger available.
        status: { type: string, enum: [INSUFFICIENT_EVIDENCE, WITHIN_EXPECTED_RANGE, ANOMALY_DETECTED] }
        score:
          type: ["number", "null"]
          description: Normalized 0-1 anomaly score. Null when status is INSUFFICIENT_EVIDENCE.
        confidence:
          type: number
          description: 0-1 evidence-quality/confidence, independent of the anomaly score itself.
        sanction: { type: ["number", "null"] }
        expenditure: { type: ["number", "null"] }
        paymentTotal: { type: ["number", "null"] }
        expenditureRatio: { type: ["number", "null"] }
        peerGroup:
          $ref: "#/components/schemas/FinancialPeerGroup"
        checks:
          type: array
          items: { $ref: "#/components/schemas/FinancialCheck" }
        reasons:
          type: array
          items: { type: string }
        recordCount: { type: integer }
        engineVersion: { type: string }
        updatedAt: { type: string }
    VisualCheck:
      type: object
      required: [name, severity, message]
      properties:
        name: { type: string }
        severity: { type: string, enum: [INFO, LOW, MODERATE, HIGH] }
        message: { type: string }
        observed:
          type: object
          additionalProperties: { type: number }
        supportingImageIds:
          type: array
          items: { type: integer }
    VisualAnalysis:
      type: object
      required: [status, score, confidence, imageCount, datedImageCount, undatedImageCount, earliestCapturedAt, latestCapturedAt, checks, reasons, engineVersion, updatedAt]
      properties:
        status: { type: string, enum: [INSUFFICIENT_EVIDENCE, CONSISTENT, REQUIRES_VERIFICATION] }
        score:
          type: ["number", "null"]
          description: Normalized 0-1 anomaly score. Null when status is INSUFFICIENT_EVIDENCE.
        confidence:
          type: number
          description: 0-1 evidence-quality/confidence, independent of the anomaly score itself.
        imageCount: { type: integer }
        datedImageCount: { type: integer }
        undatedImageCount: { type: integer }
        earliestCapturedAt: { type: ["string", "null"] }
        latestCapturedAt: { type: ["string", "null"] }
        checks:
          type: array
          items: { $ref: "#/components/schemas/VisualCheck" }
        reasons:
          type: array
          items: { type: string }
        crossProjectMatch:
          oneOf:
            - $ref: "#/components/schemas/CrossProjectVisualMatch"
            - type: "null"
          description: >-
            Set when an evidence photograph for this project is an exact or perceptual
            near-duplicate of one submitted for a DIFFERENT project. Null when no such
            match exists. Detection is perceptual-hash comparison only — it carries no
            claim about what either photograph depicts.
        engineVersion: { type: string }
        updatedAt: { type: string }
    CrossProjectVisualMatch:
      type: object
      required: [currentImageId, matchedProjectId, matchedProjectName, matchedImageId, hammingDistance, hashBits, similarityPercent, isExactDuplicate]
      properties:
        currentImageId: { type: integer, description: "This project's image that matched." }
        matchedProjectId: { type: string }
        matchedProjectName: { type: ["string", "null"] }
        matchedImageId: { type: integer }
        hammingDistance: { type: integer, description: "Differing bits between the two perceptual hashes." }
        hashBits: { type: integer, description: "Total bits compared, so the percentage can be checked." }
        similarityPercent:
          type: number
          description: "(hashBits - hammingDistance) / hashBits, as a percentage. A measured hash agreement, not a model confidence."
        isExactDuplicate: { type: boolean, description: "True when the two files are also byte-for-byte identical (same SHA-256)." }
    EvidenceImage:
      type: object
      required: [id, projectId, originalFilename, mimeType, fileSizeBytes, width, height, capturedAt, gpsLatitude, gpsLongitude, gpsAccuracyMeters, sha256, perceptualHash, label, source, uploadedAt]
      properties:
        id: { type: integer }
        projectId: { type: string }
        originalFilename: { type: ["string", "null"] }
        mimeType: { type: ["string", "null"] }
        fileSizeBytes: { type: ["integer", "null"] }
        width: { type: ["integer", "null"] }
        height: { type: ["integer", "null"] }
        capturedAt:
          type: ["string", "null"]
          description: Actual EXIF capture timestamp, if present in the file. Never the upload time.
        gpsLatitude: { type: ["number", "null"] }
        gpsLongitude: { type: ["number", "null"] }
        gpsAccuracyMeters: { type: ["number", "null"] }
        sha256: { type: ["string", "null"] }
        perceptualHash: { type: ["string", "null"] }
        label: { type: ["string", "null"] }
        source: { type: string }
        uploadedAt: { type: string }
    TextCheck:
      type: object
      required: [name, severity, message]
      properties:
        name: { type: string }
        severity: { type: string, enum: [INFO, LOW, MODERATE, HIGH] }
        message: { type: string }
        observed:
          type: object
          additionalProperties: { type: number }
        supportingProjectIds:
          type: array
          items: { type: string }
    TextPeerMatch:
      type: object
      required: [projectId, similarity]
      properties:
        projectId: { type: string }
        similarity: { type: number }
    TextPeerGroup:
      type: object
      required: [dimension, size, topMatches, averageSimilarity]
      properties:
        dimension: { type: string, description: "Which project fields defined the peer group, e.g. 'category + district'." }
        size: { type: integer }
        topMatches:
          type: array
          items: { $ref: "#/components/schemas/TextPeerMatch" }
        averageSimilarity: { type: ["number", "null"] }
    TextAnalysis:
      type: object
      required: [status, score, confidence, descriptionLength, tokenCount, categoryKeywordsAvailable, categoryMatchCount, peerGroup, checks, reasons, method, engineVersion, updatedAt]
      properties:
        status: { type: string, enum: [INSUFFICIENT_EVIDENCE, CONSISTENT, POTENTIALLY_INCONSISTENT, REQUIRES_VERIFICATION] }
        score:
          type: ["number", "null"]
          description: Normalized 0-1 anomaly score. Null when status is INSUFFICIENT_EVIDENCE.
        confidence:
          type: number
          description: 0-1 evidence-quality/confidence, independent of the anomaly score itself.
        descriptionLength: { type: integer }
        tokenCount: { type: integer }
        categoryKeywordsAvailable: { type: boolean }
        categoryMatchCount: { type: integer }
        peerGroup:
          $ref: "#/components/schemas/TextPeerGroup"
        checks:
          type: array
          items: { $ref: "#/components/schemas/TextCheck" }
        reasons:
          type: array
          items: { type: string }
        method: { type: string, description: "The actual similarity method used (deterministic TF-IDF cosine similarity, not a learned model)." }
        engineVersion: { type: string }
        updatedAt: { type: string }
    GeoCheck:
      type: object
      required: [name, severity, message]
      properties:
        name: { type: string }
        severity: { type: string, enum: [INFO, LOW, MODERATE, HIGH] }
        message: { type: string }
        observed:
