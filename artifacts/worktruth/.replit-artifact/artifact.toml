kind = "web"
previewPath = "/"
title = "WorkTruth"
description = "An AI-powered evidence-integrity and verification-prioritization platform for monitoring MPLADS projects, with explainable analysis, risk queues, geospatial context, and officer investigations."
version = "1.0.0"
id = "artifacts/worktruth"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25241

[services.development]
run = "pnpm --filter @workspace/worktruth run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/worktruth", "run", "build" ]
serve = "static"
publicDir = "artifacts/worktruth/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25241"
BASE_PATH = "/"
